name: CQL Testing and Analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:

  go_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:

    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'
      id: go

    - name: Get dependencies
      run: |
            go mod download
    - name: Build
      run: |
            go build ./...

    - name: Test
      run: |
            go test ./...

  go_spec_test_coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:

    - name: Check out code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'
      id: go

    - name: Get dependencies
      run: |
            go mod download
    - name: Build
      run: |
            go build ./...

    - name: Spec Test Coverage
      run: |
            set -o pipefail
            go run tests/spectests/cmd/analyzer/analyzer.go 2>&1 | tee analyzer-output.txt
            {
              echo '## CQL Test Analyzer Results'
              echo '```'
              cat analyzer-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
